{
  "apiVersion": "registry.agentic.dev/v1alpha1",
  "kind": "MCPServer",
  "metadata": {
    "labels": {
      "devai.io/source": "onboarding-service",
      "mcp.devai.io/server": "operator-onboarding-mcp",
      "mcp.tesserix.app/class": "platform",
      "mcp.tesserix.app/tenant": "onboarding"
    },
    "name": "operator-onboarding-mcp",
    "namespace": "devai",
    "visibility": "internal"
  },
  "spec": {
    "authMode": "bearer",
    "description": "Authenticated operational hospital identity onboarding. Read and create roles are separate; adoption requires explicit additional authority. No clinical data or deletion tools.",
    "displayName": "Operator Onboarding MCP",
    "endpoint": "http://onboarding-api.onboarding.svc.cluster.local:8080/mcp",
    "name": "operator-onboarding-mcp",
    "protocolVersion": "2026-07-28",
    "remotes": [
      {
        "type": "streamableHttp",
        "url": "http://onboarding-api.onboarding.svc.cluster.local:8080/mcp"
      }
    ],
    "toolSelector": {
      "matchLabels": {
        "mcp.devai.io/server": "operator-onboarding-mcp"
      }
    },
    "tools": [
      "adopt_hospital_onboarding",
      "get_hospital_onboarding",
      "get_onboarding_context",
      "list_hospital_tenants",
      "request_hospital_onboarding"
    ],
    "x-tesserix": {
      "consumerProfile": "privileged-operator",
      "contractDigest": "sha256:94c5f0e960b9ae12cf523da3cf46c7d2b7da892568e432f9f0cd6b807ef1eed4",
      "directAccess": false,
      "gatewayProject": "387190457387450503",
      "resourceAudience": "395476377970673709",
      "source": "https://github.com/tesserix/onboarding-service",
      "transport": "stateless"
    }
  }
}
