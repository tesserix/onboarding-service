    "visibility": "internal"
  },
  "spec": {
    "annotations": {
      "destructiveHint": false,
      "idempotentHint": true,
      "openWorldHint": false,
      "readOnlyHint": false
    },
    "description": "Adopt an EXISTING verified hospital binding without changing its login policy. Requires separate adoption authority and explicit user intent; never invent or replace identifiers.",
    "displayName": "adopt_hospital_onboarding",
    "effects": [
      "identity.adopt"
    ],
    "idempotency": "caller_key",
    "inputSchema": {
      "additionalProperties": false,
      "properties": {
        "displayName": {
          "type": "string"
        },
        "idempotencyKey": {
          "description": "16 to 200 characters; retain this exact key and intent across retries",
          "type": "string"
        },
        "initialAdminUserId": {
          "description": "Existing verified Zitadel user to appoint; do not invent a user ID",
          "type": "string"
        },
        "organizationId": {
          "type": "string"
        },
        "preserveLoginPolicy": {
          "description": "Must be true to preserve the existing login policy",
          "type": "boolean"
        },
        "tenantId": {
          "type": "string"
        }
      },
      "required": [
        "displayName",
        "initialAdminUserId",
        "idempotencyKey",
        "tenantId",
        "organizationId",
        "preserveLoginPolicy"
      ],
      "type": "object"
    },
    "outputSchema": {
      "additionalProperties": false,
      "properties": {
        "archiveGeneration": {
          "type": "string"
        },
        "archiveObject": {
          "type": "string"
        },
        "displayName": {
          "type": "string"
        },
        "generation": {
          "type": "integer"
        },
        "observedGeneration": {
          "type": "integer"
        },
        "organizationId": {
          "type": "string"
        },
        "reason": {
          "type": "string"
        },
        "sourceLocator": {
          "type": "string"
        },
        "state": {
          "type": "string"
        },
        "tenantId": {
          "type": "string"
        }
      },
      "required": [
        "state",
        "tenantId",
        "displayName",
        "organizationId",
        "reason",
        "generation",
        "observedGeneration",
        "archiveObject",
        "archiveGeneration",
        "sourceLocator"
      ],
      "type": "object"
    },
    "requiredScopes": [
      "onboarding.helivanta.read",
      "onboarding.helivanta.adopt"
    ],
    "server": "operator-onboarding-mcp",
    "tags": [
      "onboarding",
      "operator",
      "mcp-tool"
    ],
    "version": "1.0.0"
  }
}
