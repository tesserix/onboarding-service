{
  "apiVersion": "registry.agentic.dev/v1alpha1",
  "kind": "Tool",
  "metadata": {
    "annotations": {
      "mcp.devai.io/wire-name": "adopt_hospital_onboarding"
    },
    "labels": {
      "devai.io/source": "onboarding-service",
      "mcp.devai.io/server": "operator-onboarding-mcp",
      "mcp.tesserix.app/class": "platform",
