name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: api (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onboarding
          POSTGRES_PASSWORD: onboarding
          POSTGRES_DB: onboarding_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      ONBOARDING_TEST_DSN: postgres://onboarding:onboarding@127.0.0.1:5432/onboarding_db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - name: load schema
        run: |
          curl -sSfL -o /tmp/onboarding_db.sql \
            https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/apps/db-schema-bootstrap/schemas/global/global/onboarding_db.sql
          PGPASSWORD=onboarding psql -h 127.0.0.1 -U onboarding -d onboarding_db -v ON_ERROR_STOP=1 -f /tmp/onboarding_db.sql
      - name: format check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./...

  image:
    name: image build
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: build api image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/Dockerfile.api
          push: false
          tags: ghcr.io/tesserix/onboarding-api:${{ github.sha }}
