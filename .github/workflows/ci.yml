name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
      release_images: ${{ steps.images.outputs.release_images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s tests -v
      - id: images
        run: |
          echo "images=$(jq -c . .github/container-images.json)" >> "$GITHUB_OUTPUT"
          echo "release_images=$(jq -c '{include: .}' .github/container-images.json)" >> "$GITHUB_OUTPUT"

  api:
    uses: tesserix/tesserix-workflows/.github/workflows/go-ci.yml@f013aca347aa44d810cf1e976c5717b28bdb0a67
    with:
      working_directory: apps/api
      go_version: 1.26.9
      # Measured with PostgreSQL: 47.4%. Prevent regression while raising coverage.
      coverage_min_lines: 47
      database_enabled: true
      database_setup_script: scripts/ci/setup-postgres.sh
      database_environment_prefix: ONBOARDING_TEST_

  web:
    uses: tesserix/tesserix-workflows/.github/workflows/nextjs-ci.yml@f013aca347aa44d810cf1e976c5717b28bdb0a67
    with:
      working_directory: apps/web
      node_version: '24'
      package_manager: pnpm
      pnpm_version: 10.12.4

  secrets:
    uses: tesserix/tesserix-workflows/.github/workflows/secret-scan.yml@f013aca347aa44d810cf1e976c5717b28bdb0a67

  containers:
    needs: contracts
    uses: tesserix/tesserix-workflows/.github/workflows/container-ci.yml@f013aca347aa44d810cf1e976c5717b28bdb0a67
    with:
      images: ${{ needs.contracts.outputs.images }}

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [contracts, api, web, secrets, containers]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: tesserix/tesserix-workflows/.github/workflows/container-release.yml@f013aca347aa44d810cf1e976c5717b28bdb0a67
    with:
      namespace: tesserix
      images: ${{ needs.contracts.outputs.release_images }}

  advance-deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Advance only after both images pass release gates
        run: git push origin "${GITHUB_SHA}:refs/heads/deploy"
